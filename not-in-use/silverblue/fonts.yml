---
- name: Configure desktop fonts
  hosts: silverblue
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Validate the Fedora Atomic host
      ansible.builtin.import_tasks: tasks/require-fedora-atomic.yml

  tasks:
    - name: Read rpm-ostree deployment state
      ansible.builtin.command:
        argv:
          - rpm-ostree
          - status
          - --json
      register: rpm_ostree_status
      changed_when: false

    - name: Find retired layered system fonts
      ansible.builtin.set_fact:
        retired_layered_system_fonts: >-
          {{
            retired_system_font_packages
            | intersect(
              (
                (
                  (rpm_ostree_status.stdout | from_json).deployments
                  | selectattr('booted', 'defined')
                  | selectattr('booted', 'equalto', true)
                  | first
                )['requested-packages']
                | default([])
              )
            )
          }}

    - name: Remove retired layered system fonts
      ansible.builtin.command:
        argv: "{{ ['rpm-ostree', 'uninstall'] + retired_layered_system_fonts }}"
      register: removed_system_fonts
      when: retired_layered_system_fonts | length > 0
      changed_when: true

    - name: Create the user font directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0755"
      loop:
        - "{{ desktop_home }}/.local/share/fonts"
        - "{{ desktop_home }}/.local/share/fonts/inter/{{ inter_font_version }}"
        - "{{ desktop_home }}/.local/share/fonts/nerd-fonts"
        - "{{ desktop_home }}/.cache/ansible/fonts"

    - name: Check installed Inter font version
      ansible.builtin.stat:
        path: "{{ desktop_home }}/.local/share/fonts/inter/{{ inter_font_version }}/.installed"
      register: inter_font_installation

    - name: Download Inter fonts
      ansible.builtin.get_url:
        url: "https://github.com/rsms/inter/releases/download/{{ inter_font_version }}/Inter-{{ inter_font_version | regex_replace('^v', '') }}.zip"
        dest: "{{ desktop_home }}/.cache/ansible/fonts/Inter-{{ inter_font_version }}.zip"
        checksum: "sha256:{{ inter_font_checksum }}"
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0644"
      when: not inter_font_installation.stat.exists

    - name: Install Inter fonts
      ansible.builtin.unarchive:
        src: "{{ desktop_home }}/.cache/ansible/fonts/Inter-{{ inter_font_version }}.zip"
        dest: "{{ desktop_home }}/.local/share/fonts/inter/{{ inter_font_version }}"
        remote_src: true
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
      when: not inter_font_installation.stat.exists
      notify: Refresh user font cache

    - name: Record installed Inter font version
      ansible.builtin.file:
        path: "{{ desktop_home }}/.local/share/fonts/inter/{{ inter_font_version }}/.installed"
        state: touch
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0644"
      when: not inter_font_installation.stat.exists

    - name: Find installed Nerd Font versions
      ansible.builtin.find:
        paths: "{{ desktop_home }}/.local/share/fonts/nerd-fonts"
        file_type: directory
        recurse: false
      register: installed_nerd_font_versions

    - name: Remove superseded Nerd Font versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ installed_nerd_font_versions.files }}"
      when: item.path | basename != nerd_fonts_version
      notify: Refresh user font cache

    - name: Remove legacy Nerd Font directories
      ansible.builtin.file:
        path: "{{ desktop_home }}/.local/share/fonts/{{ item.name }}"
        state: absent
      loop: "{{ nerd_fonts }}"
      notify: Refresh user font cache

    - name: Create the current Nerd Font directories
      ansible.builtin.file:
        path: "{{ desktop_home }}/.local/share/fonts/nerd-fonts/{{ nerd_fonts_version }}/{{ item.name }}"
        state: directory
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0755"
      loop: "{{ nerd_fonts }}"

    - name: Check installed Nerd Fonts
      ansible.builtin.stat:
        path: "{{ desktop_home }}/.local/share/fonts/nerd-fonts/{{ nerd_fonts_version }}/{{ item.name }}/.installed"
      loop: "{{ nerd_fonts }}"
      register: nerd_font_installations

    - name: Download Nerd Fonts
      ansible.builtin.get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item.item.name }}.tar.xz"
        dest: "{{ desktop_home }}/.cache/ansible/fonts/{{ item.item.name }}-{{ nerd_fonts_version }}.tar.xz"
        checksum: "sha256:{{ item.item.checksum }}"
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0644"
      loop: "{{ nerd_font_installations.results }}"
      when: not item.stat.exists

    - name: Install Nerd Fonts
      ansible.builtin.unarchive:
        src: "{{ desktop_home }}/.cache/ansible/fonts/{{ item.item.name }}-{{ nerd_fonts_version }}.tar.xz"
        dest: "{{ desktop_home }}/.local/share/fonts/nerd-fonts/{{ nerd_fonts_version }}/{{ item.item.name }}"
        remote_src: true
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
      loop: "{{ nerd_font_installations.results }}"
      when: not item.stat.exists
      notify: Refresh user font cache

    - name: Record installed Nerd Font version
      ansible.builtin.file:
        path: "{{ desktop_home }}/.local/share/fonts/nerd-fonts/{{ nerd_fonts_version }}/{{ item.item.name }}/.installed"
        state: touch
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0644"
      loop: "{{ nerd_font_installations.results }}"
      when: not item.stat.exists

    - name: Report pending system font removal
      ansible.builtin.debug:
        msg: System font removal was staged; reboot when convenient.
      when: removed_system_fonts is defined and removed_system_fonts.changed

  handlers:
    - name: Refresh user font cache
      ansible.builtin.command:
        argv:
          - fc-cache
          - --force
      become_user: "{{ desktop_user }}"
      become: true
      environment:
        HOME: "{{ desktop_home }}"
      changed_when: true
