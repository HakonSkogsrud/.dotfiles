---
- name: Configure Fedora Workstation networking
  hosts: fedora_workstation
  become: true
  vars_files: [vars.yml]

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/require-fedora-workstation.yml

  tasks:
    - name: Add the Tailscale repository
      ansible.builtin.get_url:
        url: "{{ tailscale_repository }}"
        dest: /etc/yum.repos.d/tailscale.repo
        owner: root
        group: root
        mode: "0644"

    - name: Install networking RPMs
      ansible.builtin.dnf:
        name: "{{ network_packages }}"
        state: present

    - name: Enable networking services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - firewalld.service
        - avahi-daemon.service
        - tailscaled.service

    - name: Enable systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        enabled: true
        state: started
      when: manage_systemd_resolved

    - name: Read the home connection firewalld zone
      ansible.builtin.command:
        argv: [nmcli, --get-values, connection.zone, connection, show, "{{ home_network_connection }}"]
      register: home_connection_zone
      changed_when: false

    - name: Assign the home connection to the home zone
      ansible.builtin.command:
        argv: [nmcli, connection, modify, "{{ home_network_connection }}", connection.zone, "{{ home_firewall_zone }}"]
      when: home_connection_zone.stdout | trim != home_firewall_zone
      changed_when: true

    - name: Read the active home network device
      ansible.builtin.command:
        argv: [nmcli, --get-values, GENERAL.DEVICES, connection, show, "{{ home_network_connection }}"]
      register: home_network_device
      changed_when: false

    - name: Read the active home device zone
      ansible.builtin.command:
        argv: [firewall-cmd, "--get-zone-of-interface={{ home_network_device.stdout | trim }}"]
      register: active_home_device_zone
      when: home_network_device.stdout | trim not in ['', '--']
      changed_when: false
      failed_when: false

    - name: Move the active home device to the home zone
      ansible.builtin.command:
        argv: [firewall-cmd, "--zone={{ home_firewall_zone }}", "--change-interface={{ home_network_device.stdout | trim }}"]
      when:
        - home_network_device.stdout | trim not in ['', '--']
        - active_home_device_zone.stdout | default('') | trim != home_firewall_zone
      changed_when: true

    - name: Read the default firewalld zone
      ansible.builtin.command: {argv: [firewall-cmd, --get-default-zone]}
      register: firewalld_default_zone
      changed_when: false

    - name: Allow LocalSend ports
      ansible.posix.firewalld:
        zone: "{{ home_firewall_zone }}"
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ localsend_ports }}"

    - name: Allow the Tailscale UDP port
      ansible.posix.firewalld:
        zone: "{{ firewalld_default_zone.stdout }}"
        port: "{{ tailscale_udp_port }}"
        permanent: true
        immediate: true
        state: enabled

    - name: Allow mDNS discovery
      ansible.posix.firewalld:
        zone: "{{ home_firewall_zone }}"
        service: mdns
        permanent: true
        immediate: true
        state: enabled

    - name: Configure loose reverse-path filtering
      ansible.builtin.template:
        src: templates/90-local-routing.conf.j2
        dest: /etc/sysctl.d/90-local-routing.conf
        mode: "0644"
      notify: Apply sysctl settings

    - name: Configure Bluetooth mouse DPI
      ansible.builtin.template:
        src: templates/99-mouse-dpi.hwdb.j2
        dest: /etc/udev/hwdb.d/99-mouse-dpi.hwdb
        mode: "0644"
      notify: [Update udev hardware database, Refresh input device properties]

    - name: Use the systemd-resolved stub resolver
      ansible.builtin.file:
        src: ../run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      when: manage_systemd_resolved
      notify: Restart systemd-resolved

    - name: Install the local-subnet policy-routing service
      ansible.builtin.template:
        src: templates/local-network-policy-rule.service.j2
        dest: /etc/systemd/system/local-network-policy-rule.service
        mode: "0644"
      register: local_route_service

    - name: Enable the local-subnet policy-routing service
      ansible.builtin.systemd_service:
        name: local-network-policy-rule.service
        enabled: true
        state: "{{ 'restarted' if local_route_service.changed else 'started' }}"
        daemon_reload: "{{ local_route_service.changed }}"

    - name: Check Tailscale authentication
      ansible.builtin.command: {argv: [tailscale, ip, -4]}
      register: tailscale_ip
      changed_when: false
      failed_when: false

    - name: Report required manual Tailscale login
      ansible.builtin.debug:
        msg: Run 'sudo tailscale up' on the laptop to authenticate it.
      when: tailscale_ip.rc != 0

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command: {argv: [sysctl, --system]}
      changed_when: true
    - name: Update udev hardware database
      ansible.builtin.command: {argv: [udevadm, hwdb, --update]}
      changed_when: true
    - name: Refresh input device properties
      ansible.builtin.command: {argv: [udevadm, trigger, --subsystem-match=input, --action=change]}
      changed_when: true
    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        state: restarted
