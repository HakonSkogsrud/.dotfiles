---
desktop_user: haaksk

local_subnet: 10.0.0.0/24
local_route_rule_priority: 5000
home_network_connection: virus.exe
home_firewall_zone: home
manage_systemd_resolved: true

tailscale_repository: https://pkgs.tailscale.com/stable/fedora/tailscale.repo

network_packages:
  - avahi
  - firewalld
  - syncthing
  - tailscale

rpm_fusion_release_packages:
  - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
  - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm"

multimedia_packages:
  - ffmpeg
  - gstreamer1-plugin-libav
  - gstreamer1-plugins-bad-free-extras
  - gstreamer1-plugins-bad-freeworld
  - gstreamer1-plugins-ugly
  - intel-media-driver

localsend_ports:
  - 53317/tcp
  - 53317/udp
tailscale_udp_port: 41641/udp

# Fedora/RPM Fusion packages are preferred. The remainder have no suitable
# Fedora RPM and stay as Flatpaks.
rpm_apps:
  - darktable
  - emacs
  - flatpak
  - gnome-tweaks
  - unzip
