onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_workspace = "alt+k"
next_workspace = "alt+j"
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

[theme.custom]
accent = "#a6a6a6"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#322a2a"
selection_bg = "#3d3434"
surface0 = "#322a2a"
surface1 = "#3d3434"
surface_dim = "#161313"
overlay0 = "#6d6666"
overlay1 = "#b5b0b0"
text = "#f3f2f2"
subtext0 = "#b5b0b0"
mauve = "#bfbfbf"
green = "#a6a6a6"
yellow = "#999999"
red = "#fd4663"
blue = "#999999"
teal = "#bfbfbf"
peach = "#fd8446"
