onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_workspace = "alt+k"
next_workspace = "alt+j"
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

[theme.custom]
accent = "#a5a7a5"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2a322a"
selection_bg = "#343d34"
surface0 = "#2a322a"
surface1 = "#343d34"
surface_dim = "#131613"
overlay0 = "#646c64"
overlay1 = "#b0b5b0"
text = "#f2f3f2"
subtext0 = "#b0b5b0"
mauve = "#bfc0bf"
green = "#a5a7a5"
yellow = "#989a98"
red = "#fd4663"
blue = "#989a9a"
teal = "#bfc0bf"
peach = "#fd8446"
