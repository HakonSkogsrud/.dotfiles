onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_workspace = "alt+k"
next_workspace = "alt+j"
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

[theme.custom]
accent = "#55dbc7"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#222b31"
selection_bg = "#2c363c"
surface0 = "#222b31"
surface1 = "#2c363c"
surface_dim = "#0b151a"
overlay0 = "#8093a0"
overlay1 = "#b5c9d7"
text = "#dae4ec"
subtext0 = "#b5c9d7"
mauve = "#55dbc7"
green = "#55dbc7"
yellow = "#83d5c6"
red = "#ffb4ab"
blue = "#8fcff3"
teal = "#83d5c6"
peach = "#ffdeab"
