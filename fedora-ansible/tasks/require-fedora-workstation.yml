---
- name: Check for an ostree boot
  ansible.builtin.stat:
    path: /run/ostree-booted
  register: ostree_boot

- name: Require regular Fedora Workstation
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Fedora"
      - not ostree_boot.stat.exists
      - ansible_facts.pkg_mgr in ["dnf", "dnf5"]
    fail_msg: This playbook must run against a mutable Fedora installation, not Fedora Atomic.

- name: Read the desktop user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ desktop_user }}"

- name: Set the desktop home directory
  ansible.builtin.set_fact:
    desktop_home: "{{ ansible_facts.getent_passwd[desktop_user][4] }}"
