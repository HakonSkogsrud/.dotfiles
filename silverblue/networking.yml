---
- name: Configure Silverblue networking
  hosts: silverblue
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Check for an ostree boot
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: ostree_boot

    - name: Require Fedora Atomic
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ostree_boot.stat.exists
        fail_msg: This playbook must run against a Fedora Atomic host.

  tasks:
    - name: Layer networking packages
      community.general.rpm_ostree_pkg:
        name: "{{ silverblue_network_packages }}"
        state: present
        apply_live: "{{ rpm_ostree_apply_live }}"
      register: rpm_ostree_packages
      retries: 5
      delay: 15
      until: rpm_ostree_packages is not failed

    - name: Enable networking services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - firewalld.service
        - avahi-daemon.service
        - tailscaled.service

    - name: Enable systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        enabled: true
        state: started
      when: manage_systemd_resolved

    - name: Read the default firewalld zone
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --get-default-zone
      register: firewalld_default_zone
      changed_when: false

    - name: Allow LocalSend ports
      ansible.posix.firewalld:
        zone: "{{ firewalld_default_zone.stdout }}"
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ localsend_ports }}"

    - name: Allow the Tailscale UDP port
      ansible.posix.firewalld:
        zone: "{{ firewalld_default_zone.stdout }}"
        port: "{{ tailscale_udp_port }}"
        permanent: true
        immediate: true
        state: enabled

    - name: Allow mDNS discovery
      ansible.posix.firewalld:
        zone: "{{ firewalld_default_zone.stdout }}"
        service: mdns
        permanent: true
        immediate: true
        state: enabled

    - name: Read the permanent Tailscale interface zone
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --get-zone-of-interface=tailscale0
      register: tailscale_firewall_zone
      changed_when: false
      failed_when: false

    - name: Trust the Tailscale interface
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=trusted
          - --change-interface=tailscale0
      when: tailscale_firewall_zone.stdout | trim != "trusted"
      changed_when: true
      notify: Reload firewalld

    - name: Configure loose reverse-path filtering
      ansible.builtin.template:
        src: templates/90-local-routing.conf.j2
        dest: /etc/sysctl.d/90-local-routing.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl settings

    - name: Create systemd-resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: manage_systemd_resolved

    - name: Configure systemd-resolved fallback routing
      ansible.builtin.template:
        src: templates/99-default-fallback.conf.j2
        dest: /etc/systemd/resolved.conf.d/99-default-fallback.conf
        owner: root
        group: root
        mode: "0644"
      when: manage_systemd_resolved
      notify: Restart systemd-resolved

    - name: Use the systemd-resolved stub resolver
      ansible.builtin.file:
        src: ../run/systemd/resolve/stub-resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      when: manage_systemd_resolved
      notify: Restart systemd-resolved

    - name: Install the local-subnet policy-routing service
      ansible.builtin.template:
        src: templates/local-network-policy-rule.service.j2
        dest: /etc/systemd/system/local-network-policy-rule.service
        owner: root
        group: root
        mode: "0644"
      register: local_route_service

    - name: Enable the local-subnet policy-routing service
      ansible.builtin.systemd_service:
        name: local-network-policy-rule.service
        enabled: true
        state: "{{ 'restarted' if local_route_service.changed else 'started' }}"
        daemon_reload: "{{ local_route_service.changed }}"

    - name: Read the active policy rules
      ansible.builtin.command:
        argv:
          - ip
          - rule
          - show
      register: policy_rules
      changed_when: false

    - name: Verify the local-subnet policy rule
      ansible.builtin.assert:
        that:
          - >-
            ('to ' ~ local_subnet ~ ' lookup main suppress_prefixlength 0')
            in policy_rules.stdout
        fail_msg: The local-subnet policy rule was not installed correctly.

    - name: Check Tailscale authentication
      ansible.builtin.command:
        argv:
          - tailscale
          - ip
          - -4
      register: tailscale_ip
      changed_when: false
      failed_when: false

    - name: Report required manual Tailscale login
      ansible.builtin.debug:
        msg: Run 'sudo tailscale up' on the laptop to authenticate it.
      when: tailscale_ip.rc != 0

    - name: Report pending rpm-ostree deployment
      ansible.builtin.debug:
        msg: rpm-ostree created a pending deployment; reboot when convenient.
      when: rpm_ostree_packages.needs_reboot | default(false)

  handlers:
    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      changed_when: true

    - name: Apply sysctl settings
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        state: restarted
