---
desktop_user: haaksk

local_subnet: 10.0.0.0/24
local_route_rule_priority: 5000
home_network_connection: virus.exe
home_firewall_zone: home

rpm_ostree_apply_live: true
manage_systemd_resolved: true

silverblue_network_packages:
  - avahi
  - syncthing
  - tailscale

rpm_fusion_release_packages:
  - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm"
  - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts.distribution_major_version }}.noarch.rpm"

silverblue_multimedia_packages:
  - gstreamer1-plugin-libav
  - gstreamer1-plugins-bad-free-extras
  - gstreamer1-plugins-bad-freeworld
  - gstreamer1-plugins-ugly

# Lunar Lake uses Intel's current VA-API media driver.
silverblue_hardware_codec_packages:
  - intel-media-driver

silverblue_ffmpeg_free_packages:
  - fdk-aac-free
  - libavcodec-free
  - libavdevice-free
  - libavfilter-free
  - libavformat-free
  - libavutil-free
  - libpostproc-free
  - libswresample-free
  - libswscale-free
  - ffmpeg-free

localsend_ports:
  - 53317/tcp
  - 53317/udp

tailscale_udp_port: 41641/udp

flatpak_apps:
  - com.brave.Browser
  - io.github.CyberTimon.RapidRAW
  - io.github.josephmawa.Bella
  - md.obsidian.Obsidian
  - org.darktable.Darktable
  - org.gnome.World.Iotas
  - org.localsend.localsend_app
  - org.onlyoffice.desktopeditors
  - org.signal.Signal

