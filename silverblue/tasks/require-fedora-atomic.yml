---
- name: Check for an ostree boot
  ansible.builtin.stat:
    path: /run/ostree-booted
  register: ostree_boot

- name: Require Fedora Atomic
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Fedora"
      - ostree_boot.stat.exists
    fail_msg: This playbook must run against a Fedora Atomic host.

- name: Read the desktop user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ desktop_user }}"

- name: Set the desktop home directory
  ansible.builtin.set_fact:
    desktop_home: "{{ ansible_facts.getent_passwd[desktop_user][4] }}"
