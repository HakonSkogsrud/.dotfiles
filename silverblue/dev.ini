[distrobox]
name=dev
image=quay.io/fedora/fedora:latest
pull=true
root=false
init=false
start_now=false

# Keep compilers, language runtimes, editors, and CLI development utilities
# inside the mutable development container rather than layering them on the
# Silverblue host.
additional_packages="zsh zsh-autosuggestions openssh-clients git git-delta gh stow uv nodejs npm ansible ansible-lint lua-language-server neovim jq wget curl fzf fd-find bat ripgrep zoxide eza tmux tree lazygit"

# Ansible's language server is distributed through npm. Ansible itself and
# ansible-lint are installed above, so the server can discover them.
init_hooks="npm install --global @ansible/ansible-language-server"
